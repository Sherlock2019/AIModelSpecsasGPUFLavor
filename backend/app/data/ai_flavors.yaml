# Customer-facing AI VM flavor tiers (product catalog).
#
# These are DEFAULT PRODUCT TIERS, not infrastructure requirements. The VRAM ranges assume
# roughly INT4/Q4 inference and are catalog guidance only - the sizing engine recalculates the
# real requirement from parameters, precision, context, concurrency, KV cache, runtime,
# workspace and safety margin, then matches vGPU / full GPU / multi-GPU infrastructure.
#
# A model belongs to the smallest enabled tier whose parameter_ceiling_b (plus the configurable
# tolerance, default 10%, so "14B" models of 14.8B still count) covers its total parameters.
# allow_vgpu / allow_full_gpu / allow_multi_gpu are product policy applied to the sizing request.

ai_flavors:
  - id: ai-1b
    display_name: AI-1B
    description: Micro AI VM
    group: small
    parameter_floor_b: 0
    parameter_ceiling_b: 1.5   # "1B class" includes 1.24B models such as Llama 3.2 1B
    baseline_precision: int4
    default_vram_min_gb: 2
    default_vram_max_gb: 4
    recommended_use_cases: [Classification, Extraction, Routing]
    example_model_ids: [llama-3.2-1b-instruct, qwen3-0.6b, gemma-3-1b-it]
    allow_vgpu: true
    allow_full_gpu: true
    allow_multi_gpu: false
    performance_tier: entry
    default_context_length: 8192
    default_concurrency: 10

