# GPU catalog (NVIDIA + AMD). Throughput figures are dense (non-sparse) peaks from the vendors'
# official datasheets. Unknown values are null - never estimated. `usable_vram_mib` is the
# framebuffer reported by nvidia-smi / rocm-smi where known; otherwise nominal vram_gb (decimal).
# cost_per_hour is intentionally null: set your own prices in the GPU Catalog admin page.
# interconnect_type: PCIe | NVLink | NVLink bridge | Infinity Fabric | ... (high-speed GPU link).
# openstack_pci_alias is site configuration (must match [pci] alias in nova.conf) and is left null
# here; the OpenStack flavor compiler lists it under requires_configuration until you set it.

